<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Módní městečko</title>
<meta name="description" content="Česká hra: převlékni postavičku v butiku, najez se v restauraci a vydej se do lesa na skákačku.">
<meta name="theme-color" content="#ff6f9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e6; --card:#fffdf8; --line:#efe4cf; --text:#2d2a32; --muted:#6a6573;
  --pink:#ff6f9c; --pink-soft:#ffe1ec; --green:#5fae3c; --yellow:#ffd23f; --violet:#7b5cff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
#game{position:fixed;inset:0;display:block}

/* horní lišta */
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.pill{background:rgba(255,253,248,.92);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:19px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pill:empty{display:none}
#hud .sp{flex:1}
#hud button{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:rgba(255,253,248,.92);font-size:21px;box-shadow:0 2px 0 rgba(0,0,0,.08)}

/* dotykové ovládání */
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:4;display:none}
body.touch #touch{display:block}
.tb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;
  border:3px solid rgba(255,255,255,.9);background:rgba(45,42,50,.28);color:#fff;font-size:34px;font-weight:800;
  display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(2px)}
.tb.on{background:rgba(255,111,156,.6)}
#tL{left:16px} #tR{left:104px} #tJ{right:16px;width:88px;height:88px}
#tA{right:16px;bottom:calc(118px + env(safe-area-inset-bottom,0px));height:60px;width:auto;border-radius:999px;padding:0 20px;font-size:20px;font-family:"Baloo 2",sans-serif;background:rgba(255,111,156,.85);display:none}
#tA.show{display:flex}
body.ui #touch{display:none}

/* panely */
#panel{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:rgba(40,30,50,.35);padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
#panel.show{display:flex}
.box{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.12);
  width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.box.small{width:min(480px,100%)}
.box header{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:2px solid var(--line)}
.box h2{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(22px,4.5vw,30px);margin:0;flex:1;line-height:1.1}
.x{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800}
.pbody{display:grid;grid-template-columns:minmax(200px,34%) 1fr;min-height:0;flex:1}
.stage{position:relative;background:radial-gradient(circle at 50% 35%,#fff,#ffeef4 60%,#ffe1ec);border-right:2px solid var(--line);min-height:220px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.side{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:16px}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:6px 12px 12px;overflow-y:auto;flex:1;min-height:0;touch-action:pan-y}
.card{position:relative;border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 4px 6px;text-align:center;font-size:13px;font-weight:800;line-height:1.15}
.card canvas{width:100%;aspect-ratio:1;display:block;border-radius:10px;background:#fbf6ff}
.card.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.card.wear{border-color:var(--green)}
.card .tag{position:absolute;top:6px;right:6px;background:var(--yellow);border-radius:999px;padding:0 7px;font-size:13px}
.card .tag.own{background:var(--green);color:#fff}
.card .tag.lock{background:#d9d2e8}
.card.none canvas{display:none}
.card.none .big{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;color:#b7aec4}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 6px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.lbl{padding:6px 12px 0;font-weight:800;color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:2px solid var(--line);flex:none;flex-wrap:wrap}
.actions .info{flex:1;min-width:140px;font-weight:700;color:var(--muted);font-size:15px}
.actions .info b{color:var(--text);font-size:17px}
.btn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px;padding:8px 22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:disabled{background:#cfc8d8;box-shadow:none}
.btn.green{background:var(--green)} .btn.ghost{background:#fff;color:var(--text);border:2px solid var(--line);box-shadow:none}
.col{display:flex;flex-direction:column;gap:10px;padding:16px;overflow-y:auto;touch-action:pan-y}
.col p{margin:0;font-size:17px;line-height:1.45}
.big-emo{font-size:56px;text-align:center;line-height:1}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lvl{border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px;text-align:left}
.lvl b{font-family:"Baloo 2",sans-serif;font-size:20px;display:block;line-height:1.1}
.lvl small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
.lvl .gems{font-size:20px;margin-top:4px;letter-spacing:2px}
.lvl:disabled{opacity:.5}
.lvl.done{border-color:var(--green)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.food{border:3px solid var(--line);background:#fff;border-radius:18px;padding:8px 10px;text-align:left;display:flex;gap:10px;align-items:center}
.food .emo{font-size:40px}
.food b{display:block;font-size:17px}
.food small{display:block;color:var(--muted);font-weight:700;font-size:13px;line-height:1.2}
.food .price{font-weight:800;font-size:15px;margin-top:2px}
.food.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
input[type=text]{font:inherit;font-size:24px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:8px 14px;width:100%;background:#fff;user-select:text;-webkit-user-select:text}
input[type=text]:focus{outline:none;border-color:var(--pink)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-10px);z-index:20;
  background:#2d2a32;color:#fff;border-radius:18px;padding:8px 18px;font-weight:800;font-size:17px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;inset:auto 0 0 0;padding:6px;text-align:center;font-weight:800;color:var(--muted);font-size:14px;display:none;pointer-events:none;z-index:3}
@media (orientation:portrait) and (max-width:700px){
  .pbody{grid-template-columns:1fr;grid-template-rows:minmax(150px,30vh) 1fr}
  .stage{border-right:0;border-bottom:2px solid var(--line);min-height:150px}
  body.play #rotate{display:block;bottom:120px}
}
@media (max-height:500px){ .stage{min-height:0} .box header{padding:6px 12px} .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span class="pill" id="hCoins"></span>
  <span class="pill" id="hGems"></span>
  <span class="pill" id="hHearts"></span>
  <span class="pill" id="hBuff"></span>
  <span class="sp"></span>
  <button id="bMenu" aria-label="Nabídka">☰</button>
</div>
<div id="touch">
  <div class="tb" id="tL">◀</div>
  <div class="tb" id="tR">▶</div>
  <div class="tb" id="tA">Vstoupit ⬆</div>
  <div class="tb" id="tJ">⤒</div>
</div>
<div id="rotate">📱 Otoč si telefon na šířku, uvidíš víc.</div>
<div id="panel"></div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
const SAVE_KEY = 'modni-mestecko-v1';
const T = 40;            // velikost dlaždice v lese
const STEP = 1 / 60;

/* ---------------- data: oblečení ---------------- */
const SKINS = ['#ffe3cf', '#f6c9a0', '#e3ab7c', '#c08456', '#8d5a36', '#5f3b23'];
const HAIR_COLORS = ['#2b1d14', '#5a3825', '#9c5530', '#d9a441', '#f3d98b', '#ece6da', '#c0392b', '#ff7fbf', '#8a6bff', '#2fa9c9'];

  {id: 'shoes', name: 'Boty'}, {id: 'hat', name: 'Na hlavu', optional: true}, {id: 'glasses', name: 'Brýle', optional: true},

  {id: 'jacket-denim', slot: 'top', name: 'Džínová bunda', style: 'jacket', c1: '#4f7fc4', c2: '#ffffff', price: 50},
  {id: 'jacket-black', slot: 'top', name: 'Černá bunda', style: 'jacket', c1: '#2d2a32', c2: '#ff6f9c', price: 60},

  {id: 'jeans', slot: 'bottom', name: 'Džíny', style: 'jeans', c1: '#3f63a8', price: 0},
  {id: 'skirt-blue', slot: 'bottom', name: 'Modrá sukně', style: 'skirt', c1: '#5aa9e6', price: 0},
  {id: 'shorts', slot: 'bottom', name: 'Žluté kraťasy', style: 'shorts', c1: '#ffcf3a', price: 15},
  {id: 'leggings', slot: 'bottom', name: 'Černé legíny', style: 'leggings', c1: '#2d2a32', price: 18},
  {id: 'pants-white', slot: 'bottom', name: 'Bílé kalhoty', style: 'jeans', c1: '#f2efe9', price: 25},
  {id: 'plaid', slot: 'bottom', name: 'Kostkovaná sukně', style: 'plaid', c1: '#c0392b', c2: '#2d2a32', price: 30},
  {id: 'tutu', slot: 'bottom', name: 'Tylová sukně', style: 'tutu', c1: '#ffb3d1', price: 35},
  {id: 'skirt-gold', slot: 'bottom', name: 'Třpytivá sukně', style: 'skirt', c1: '#e8b923', c2: '#fff6c4', sparkle: true, price: 45},

  {id: 'dress-sun', slot: 'dress', name: 'Letní šaty', style: 'dress', c1: '#ffd23f', c2: '#ffffff', price: 40},
  {id: 'dress-polka', slot: 'dress', name: 'Puntíkaté šaty', style: 'polka', c1: '#ff6f9c', c2: '#ffffff', price: 45},
  {id: 'overall', slot: 'dress', name: 'Lacláče', style: 'overall', c1: '#4f7fc4', c2: '#ffcf3a', price: 45},
  {id: 'dress-party', slot: 'dress', name: 'Šaty na párty', style: 'party', c1: '#7b5cff', c2: '#ffd23f', price: 70},
  {id: 'gown', slot: 'dress', name: 'Plesové šaty', style: 'gown', c1: '#5ed1e8', c2: '#ffffff', price: 120},
  {id: 'gown-rose', slot: 'dress', name: 'Růžové plesové šaty', style: 'gown', c1: '#ff8fb8', c2: '#ffe0ec', gems: 9},

  {id: 'sneakers', slot: 'shoes', name: 'Bílé tenisky', style: 'sneakers', c1: '#ffffff', c2: '#ff6f9c', price: 0},
  {id: 'sneakers-black', slot: 'shoes', name: 'Černé tenisky', style: 'sneakers', c1: '#2d2a32', c2: '#ffffff', price: 20},
  {id: 'sandals', slot: 'shoes', name: 'Sandálky', style: 'sandals', c1: '#c98a4b', price: 15},
  {id: 'rain', slot: 'shoes', name: 'Holínky', style: 'rain', c1: '#ffcf3a', price: 20},
  {id: 'ballet', slot: 'shoes', name: 'Baleríny', style: 'ballet', c1: '#ff8fb8', price: 25},

  {id: 'bow', slot: 'hat', name: 'Mašle', style: 'bow', c1: '#ff4f7b', price: 10},
  {id: 'flower', slot: 'hat', name: 'Kytička do vlasů', style: 'flower', c1: '#ffd23f', c2: '#ff6f9c', price: 12},
  {id: 'cap', slot: 'hat', name: 'Kšiltovka', style: 'cap', c1: '#e74c3c', price: 18},
  {id: 'beanie', slot: 'hat', name: 'Kulich', style: 'beanie', c1: '#7fdcc0', c2: '#ffffff', price: 20},

  {id: 'glasses', slot: 'glasses', name: 'Kulaté brýle', style: 'round', c1: '#2d2a32', price: 15},
  {id: 'sun', slot: 'glasses', name: 'Sluneční brýle', style: 'sun', c1: '#2d2a32', price: 20},
  {id: 'hearts', slot: 'glasses', name: 'Srdíčkové brýle', style: 'heart', c1: '#ff4f7b', price: 25},
  {id: 'stars', slot: 'glasses', name: 'Hvězdné brýle', style: 'star', c1: '#ffcf3a', gems: 6},

  {id: 'scarf', slot: 'extra', name: 'Šála', style: 'scarf', c1: '#e74c3c', c2: '#ffffff', price: 15},
  {id: 'bag', slot: 'extra', name: 'Kabelka', style: 'bag', c1: '#ff6f9c', price: 25},
  {id: 'backpack', slot: 'extra', name: 'Batůžek', style: 'backpack', c1: '#ff8f3a', price: 25},
  {id: 'cape', slot: 'extra', name: 'Plášť hrdinky', style: 'cape', c1: '#c0392b', c2: '#ffd23f', price: 45},
  {id: 'wings', slot: 'extra', name: 'Vílí křídla', style: 'wings', c1: '#bfefff', gems: 12},
  {id: 'cape-star', slot: 'extra', name: 'Hvězdný plášť', style: 'cape', c1: '#24205a', c2: '#ffd23f', stars: true, gems: 15},
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));

const FOODS = [
  {id: 'fruit', emo: '🍓', name: 'Jahody', desc: 'Jen tak pro radost', price: 0},
  {id: 'pizza', emo: '🍕', name: 'Pizza', desc: '+1 srdíčko navíc', price: 8},
  {id: 'soup', emo: '🍲', name: 'Polévka', desc: '+2 srdíčka navíc', price: 16},
  {id: 'pasta', emo: '🍝', name: 'Špagety', desc: 'Rychlejší běh', price: 12},
  {id: 'icecream', emo: '🍦', name: 'Zmrzlina', desc: 'Vyšší skok', price: 12},
  {id: 'pancakes', emo: '🥞', name: 'Palačinky', desc: 'Mince letí k tobě', price: 15},
  {id: 'cake', emo: '🍰', name: 'Dort', desc: 'Všechno najednou!', price: 40},
];
const FOOD = Object.fromEntries(FOODS.map(f => [f.id, f]));
const buffHas = (b, what) => {
  if (!b) return 0;
  if (b === 'cake') return 1;
  return ({pizza: {hearts: 1}, soup: {hearts: 2}, pasta: {speed: 1}, icecream: {jump: 1}, pancakes: {magnet: 1}}[b] || {})[what] || 0;
};

/* ---------------- uložená hra ---------------- */
const DEFAULT_OUTFIT = {skin: SKINS[1], hairStyle: 'long', hairColor: HAIR_COLORS[1], top: 'tee-pink', bottom: 'jeans', dress: null, shoes: 'sneakers', hat: null, glasses: null, extra: null};
let state;
function freshState() {
  return {v: 1, name: '', started: false, outfit: {...DEFAULT_OUTFIT}, owned: ITEMS.filter(i => i.price === 0).map(i => i.id),
    coins: 25, gems: {}, done: {}, unlocked: 1, buff: null, townX: 300, sound: true, seen: {}};
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.v === 1) { state = Object.assign(freshState(), s); state.outfit = Object.assign({...DEFAULT_OUTFIT}, s.outfit); return; }
  } catch (e) {}
  state = freshState();
}
let dirty = false;
function save() {
  dirty = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
const markDirty = () => { dirty = true; };
setInterval(() => { if (dirty) save(); }, 1500);
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
const totalGems = () => Object.values(state.gems).reduce((a, g) => a + g.filter(Boolean).length, 0);

/* ---------------- zvuky ---------------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = 0.12, type = 'square', vol = 0.08, f2 = null, delay = 0) {
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const SFX = {
  coin: () => { tone(988, 0.07, 'square', 0.05); tone(1319, 0.14, 'square', 0.05, null, 0.06); },
  jump: () => tone(380, 0.16, 'square', 0.045, 760),
  bounce: () => tone(260, 0.3, 'sine', 0.12, 900),

const KEYS = {ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'up', KeyW: 'up', Enter: 'act', KeyE: 'act'};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.code === 'Enter' && ui && ui.onEnter) ui.onEnter(); return; }
  const k = KEYS[e.code];

  }

  if (k === 'jump' || k === 'up') input.jump = false;

function bindTouch(id, on, off) {
  const el = document.getElementById(id); const ids = new Set();
  el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); ids.add(e.pointerId); el.setPointerCapture && el.setPointerCapture(e.pointerId); el.classList.add('on'); on(); });

function updateTown(dt) {
  const P = town, sp = 300;
  if (input.left) { P.vx = -sp; P.facing = -1; } else if (input.right) { P.vx = sp; P.facing = 1; } else P.vx = 0;
  P.x = Math.max(40, Math.min(TOWN_W - 40, P.x + P.vx * dt));
  if (P.vx) P.walk += dt * 11;
  if (input.jumpPressed && P.y === 0) { P.vy = -520; SFX.jump(); }
  if (P.y < 0 || P.vy < 0) { P.vy += 1800 * dt; P.y = Math.min(0, P.y + P.vy * dt); if (P.y === 0) P.vy = 0; }
  input.jumpPressed = false;
  P.near = DOORS.find(d => Math.abs(d.x - P.x) < 70) || null;
  $('#tA').classList.toggle('show', !!P.near);
  if (P.near) $('#tA').textContent = (P.near.kind === 'forest' ? 'Do lesa' : 'Vstoupit') + ' ⬆';
  if (input.actPressed && P.near) { input.actPressed = false; enterDoor(P.near.kind); }
  input.actPressed = false;
  // kočka u kašny
  P.catT -= dt;
  if (Math.abs(P.x - 1900) < 90 && P.catT <= 0) { P.catT = 6; P.catSay = 1.6; SFX.meow(); }
  P.catSay = Math.max(0, P.catSay - dt);
  if (Math.abs(state.townX - P.x) > 20) { state.townX = Math.round(P.x); markDirty(); }
}

const SOLID = new Set(['#', 'B', '?', '!', 'U', 'T']);

function buildLevel(def) {
  const W = def.w, H = 12, g = [...Array(H)].map(() => Array(W).fill(' '));
  const set = (x, y, ch) => { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = ch; };
  for (let x = 0; x < W; x++) { set(x, 10, '#'); set(x, 11, '#'); }
  for (const [cmd, x, y, n] of def.ops) {
    switch (cmd) {
      case 'gap': for (let i = x; i < x + y; i++) { set(i, 10, ' '); set(i, 11, ' '); } break;
      case 'water': for (let i = x; i < x + y; i++) { set(i, 10, 'w'); set(i, 11, 'w'); } break;
      case 'hill': for (let i = x; i < x + y; i++) for (let r = 10 - n; r < 10; r++) set(i, r, '#'); break;
      case 'plat': for (let i = x; i < x + n; i++) set(i, y, '='); break;
      case 'block': for (let i = x; i < x + n; i++) set(i, y, 'B'); break;
      case 'coins': for (let i = x; i < x + n; i++) set(i, y, 'o'); break;
      case 'arc': for (let i = 0; i < n; i++) set(x + i, y - Math.round(Math.sin(Math.PI * i / (n - 1)) * 2), 'o'); break;
      case 'spikes': for (let i = x; i < x + y; i++) set(i, n, '^'); break;
      case 'put': set(x, y, n); break;
    }
  }
  return {g, w: W, h: H};
}

const tileAt = (tx, ty) => (ty < 0 || ty >= L.h || tx < 0 || tx >= L.w) ? ' ' : L.g[ty][tx];
const solidAt = (tx, ty) => (tx < 0 || tx >= L.w) ? true : SOLID.has(tileAt(tx, ty));
function moveBody(b, dt) {
  b.hitWall = 0;
  b.x += b.vx * dt;
  let y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) { const tx = Math.floor((b.x + b.w - 0.01) / T); for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = tx * T - b.w; b.hitWall = 1; break; } }
  else if (b.vx < 0) { const tx = Math.floor(b.x / T); for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * T; b.hitWall = -1; break; } }
  if (b.hitWall) b.vx = 0;
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.onGround = false; b.land = null; b.bump = null;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) {
      const ch = tileAt(tx, ty);
      if (SOLID.has(ch) || (ch === '=' && prevBottom <= ty * T + 1)) { b.y = ty * T - b.h; b.vy = 0; b.onGround = true; b.land = {ch, tx, ty}; break; }
    }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / T), mid = Math.floor((b.x + b.w / 2) / T);
    for (const tx of [mid, x0, x1]) if (solidAt(tx, ty) && ty >= 0) { b.y = (ty + 1) * T; b.vy = 0; b.bump = {tx, ty}; break; }
  }
}

function updateForest(dt) {
  run.t += dt;
  if (run.over) { input.jumpPressed = false; return; }
  const speed = buffHas(run.buff, 'speed') ? 340 : 265, jumpV = buffHas(run.buff, 'jump') ? 880 : 760;
  if (run.win) {
    run.win += dt; P.vx = 0; P.vy += 2000 * dt; moveBody(P, dt);
    if (run.win > 1.6 && !run.shown) { run.shown = true; finishLevel(); }
    input.jumpPressed = false; return;
  }
  P.stun = Math.max(0, P.stun - dt); P.inv = Math.max(0, P.inv - dt);
  if (!P.stun) {
    const acc = P.onGround ? 2600 : 1700;
    if (input.left && !input.right) { P.vx = Math.max(-speed, P.vx - acc * dt); P.facing = -1; }
    else if (input.right && !input.left) { P.vx = Math.min(speed, P.vx + acc * dt); P.facing = 1; }
    else { const fr = (P.onGround ? 2800 : 900) * dt; P.vx = Math.abs(P.vx) <= fr ? 0 : P.vx - Math.sign(P.vx) * fr; }
  }
  if (input.jumpPressed) P.jbuf = 0.13; input.jumpPressed = false;
  P.jbuf = Math.max(0, P.jbuf - dt);
  P.coyote = P.onGround ? 0.1 : Math.max(0, P.coyote - dt);
  if (P.jbuf > 0 && P.coyote > 0) { P.vy = -jumpV; P.jbuf = 0; P.coyote = 0; P.onGround = false; SFX.jump(); }
  if (!input.jump && P.vy < -320 && !P.spring) P.vy = -320;
  P.vy = Math.min(950, P.vy + 2000 * dt);
  moveBody(P, dt);
  if (P.vy >= 0) P.spring = false;
  if (P.land && P.land.ch === 'T') { P.vy = -1120; P.spring = true; P.onGround = false; L.squash[P.land.tx + ',' + P.land.ty] = 0.3; SFX.bounce(); }
  if (P.bump) {
    const {tx, ty} = P.bump, ch = tileAt(tx, ty);
    if (ch === '?') { L.g[ty][tx] = 'U'; addCoins(3, tx * T + 20, ty * T - 10); parts.push({type: 'pop', x: tx * T + 20, y: ty * T - 10, vy: -300, life: 0.5}); }
    else if (ch === '!') { L.g[ty][tx] = 'U'; run.hearts = Math.min(run.hearts + 1, 6); run.maxHearts = Math.max(run.maxHearts, run.hearts); SFX.gem(); parts.push({type: 'txt', x: tx * T + 20, y: ty * T - 10, vy: -60, life: 1, text: '❤️'}); }
    else SFX.bump();
  }
  if (Math.abs(P.vx) > 5 && P.onGround) P.walk += dt * Math.abs(P.vx) / 26;
  // pasti
  const cx0 = Math.floor((P.x + 3) / T), cx1 = Math.floor((P.x + P.w - 3) / T), cy0 = Math.floor((P.y + 20) / T), cy1 = Math.floor((P.y + P.h - 2) / T);
  for (let ty = cy0; ty <= cy1; ty++) for (let tx = cx0; tx <= cx1; tx++) {
    const ch = tileAt(tx, ty);
    if (ch === '^' && P.y + P.h > ty * T + 18) hurt(-P.facing);
    if (ch === 'w' && P.y + P.h > ty * T + 14) { puff(P.x + P.w / 2, ty * T + 10, '#7fd0f0', 14); respawn(); return; }
  }
  if (P.y > L.h * T + 60) { respawn(); return; }
  // entity
  const magnet = buffHas(run.buff, 'magnet');
  for (const e of ents) {
    if (e.dead) { e.dead -= dt; continue; }
    switch (e.type) {

    body.style.overflowY = '';
    const slot = SLOTS.find(s => s.id === st.slot);
    let list = ITEMS.filter(i => i.slot === slot.id);
    if (home) list = list.filter(i => state.owned.includes(i.id));
    body.innerHTML = `<div class="grid" id="g"></div>`;
    const g = $('#g'), cur = home ? state.outfit : st.tryOn;
    if (slot.optional) {
      const card = document.createElement('button'); card.className = 'card none' + (!cur[slot.id] ? ' on' : '');
      card.innerHTML = `<div class="big">∅</div>Nic`; g.appendChild(card);
      card.onclick = () => { SFX.click(); cur[slot.id] = null; if (home) { save(); } else { st.sel = null; } render(); };
    }
    for (const it of list) {
      const owned = state.owned.includes(it.id), wearing = state.outfit[it.slot] === it.id && !(it.slot !== 'dress' && (it.slot === 'top' || it.slot === 'bottom') && state.outfit.dress);
      const card = document.createElement('button');
      card.className = 'card' + (cur[it.slot] === it.id ? ' on' : '');
      let tag = '';
      if (!home) tag = owned ? '<span class="tag own">✓</span>' : it.gems ? `<span class="tag ${totalGems() >= it.gems ? '' : 'lock'}">💎${it.gems}</span>` : `<span class="tag">🪙${it.price}</span>`;
      card.innerHTML = `<canvas></canvas>${esc(it.name)}${tag}`;
      g.appendChild(card);
      const o = {...state.outfit}; wearItem(o, it);
      if (it.slot !== 'hat') o.hat = null;
      thumb(card.querySelector('canvas'), o, it.slot);
      card.onclick = () => {
        SFX.click();
        if (home) { wearItem(state.outfit, it); save(); }
        else { wearItem(st.tryOn, it); st.sel = it.id; }
        render();
      };
    }
    if (home && !list.length) body.innerHTML = `<div class="col"><p>Tady zatím nic nemáš. Zajdi do <b>Módního butiku</b>! 🛍️</p></div>`;
    // akce
    if (home) {
      acts.innerHTML = `<div class="info">Klepni na věc a hned si ji oblečeš. Nové věci koupíš v butiku.</div><button class="btn green" data-close>Hotovo</button>`;
    } else {
      const it = st.sel && ITEM[st.sel];
      if (!it) acts.innerHTML = `<div class="info">Klepni na věc a vyzkoušej si ji. 🪞</div>`;
      else {
        const owned = state.owned.includes(it.id), gemsOk = it.gems && totalGems() >= it.gems;
        let btn;
        if (owned) btn = `<button class="btn green" id="buy">Obléct</button>`;
        else if (it.gems) btn = gemsOk ? `<button class="btn" id="buy">Vzít si odměnu 🎁</button>` : `<button class="btn" disabled>Potřebuješ 💎 ${it.gems}</button>`;
        else btn = state.coins >= it.price ? `<button class="btn" id="buy">Koupit za 🪙 ${it.price}</button>` : `<button class="btn" disabled>Chybí ti 🪙 ${it.price - state.coins}</button>`;
        const note = owned ? 'Tohle už máš.' : it.gems ? 'Odměna za drahokamy z lesa.' : (state.coins >= it.price ? '' : 'Mince najdeš v lese. 🌲');
        acts.innerHTML = `<div class="info"><b>${esc(it.name)}</b><br>${note}</div>${btn}`;
        const b = $('#buy');
        if (b) b.onclick = () => {
          if (!owned) { if (!it.gems) state.coins -= it.price; state.owned.push(it.id); SFX.buy(); toast(`Hurá! ${it.name} je tvoje! 🛍️`); }
          else SFX.click();
          wearItem(state.outfit, it); st.tryOn = {...state.outfit}; save(); refreshCoins(); render();
        };
      }
    }
  }
  render();
}
function swatches(el, list, cur, on) {
  list.forEach(col => { const b = document.createElement('button'); b.className = 'sw' + (col === cur ? ' on' : ''); b.style.background = col; b.setAttribute('aria-label', col); b.onclick = () => { SFX.click(); on(col); }; el.appendChild(b); });
}

/* ---- restaurace ---- */
function openRestaurant() {
  const st = {sel: null, eating: 0, food: null};
  showPanel(`<div class="box">
    <header><h2>🍝 Restaurace U Kuchtíka</h2><span class="pill" id="pCoins"></span><button class="x" data-close aria-label="Zavřít">✕</button></header>
    <div class="pbody"><div class="stage" style="background:radial-gradient(circle at 50% 30%,#fff,#fff3d6 70%)"><canvas id="pv"></canvas></div>
    <div class="side"><div class="col"><p>Co si dáš? Jídlo ti dodá sílu na <b>příští výpravu do lesa</b>.</p><div class="menu" id="menu"></div></div>
    <div class="actions" id="acts"></div></div></div></div>`, {
    preview: (t) => previewLoop($('#pv'), (c, W, H) => {
      drawStage(c, W, H, state.outfit, t, {eat: st.eating > 0});
      const s = Math.min(H / 145, W / 75);
      c.save(); c.translate(W / 2, H * 0.93); c.scale(s, s);
      c.fillStyle = '#c98a4b'; rr(c, -42, -34, 84, 7, 3); c.fill(); c.fillStyle = '#fff'; c.fillRect(-44, -30, 88, 10);
      c.fillStyle = '#e74c3c'; for (let i = 0; i < 8; i++) if (i % 2) c.fillRect(-44 + i * 11, -30, 11, 10);
      c.fillStyle = '#8a5533'; c.fillRect(-36, -20, 5, 20); c.fillRect(31, -20, 5, 20);
      c.fillStyle = '#fff'; ell(c, 0, -36, 17, 4); c.fill();
      const f = st.food || (st.sel && FOOD[st.sel]);
      if (f) {
        const k = st.eating > 0 ? Math.max(0.1, st.eating / 3) : 1;
        c.font = `${22 * k}px "Noto Color Emoji","Apple Color Emoji",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(f.emo, 0, -36);
      }
      if (st.eating > 0) { c.font = '800 12px "Baloo 2", sans-serif'; c.textAlign = 'center'; c.fillStyle = '#ff4f7b'; c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6); c.fillText('Mňam!', 24, -100 - (t * 10 % 10)); c.globalAlpha = 1; }
      c.restore();
    }),
    tick: (dt) => {
      if (st.eating > 0) {
        if (Math.floor(st.eating * 3) !== Math.floor((st.eating - dt) * 3)) SFX.eat();
        st.eating -= dt;
        if (st.eating <= 0) { st.eating = 0; doneEating(); }
      }
    }
  });
  const refresh = () => {
    $('#pCoins').textContent = `🪙 ${state.coins}`;
    const m = $('#menu'); m.innerHTML = '';
    FOODS.forEach(f => {
      const b = document.createElement('button'); b.className = 'food' + (st.sel === f.id ? ' on' : '');
      b.innerHTML = `<span class="emo">${f.emo}</span><span><b>${f.name}</b><small>${f.desc}</small><span class="price">${f.price ? '🪙 ' + f.price : 'zdarma'}</span></span>`;
      b.onclick = () => { if (st.eating) return; SFX.click(); st.sel = f.id; refresh(); };
      m.appendChild(b);
    });
    const acts = $('#acts'), f = st.sel && FOOD[st.sel];
    const cur = state.buff ? `Teď máš v bříšku: ${FOOD[state.buff].emo} ${FOOD[state.buff].desc}.` : '';
    if (st.eating) acts.innerHTML = `<div class="info"><b>Mňam, mňam…</b></div>`;
    else if (!f) acts.innerHTML = `<div class="info">${cur || 'Vyber si z jídelního lístku.'}</div>`;
    else {
      const ok = state.coins >= f.price;
      acts.innerHTML = `<div class="info"><b>${f.emo} ${f.name}</b><br>${f.desc}${state.buff && f.price ? '<br>(nahradí to, co už máš)' : ''}</div>` +
        (ok ? `<button class="btn" id="order">${f.price ? 'Objednat za 🪙 ' + f.price : 'Dát si'}</button>` : `<button class="btn" disabled>Chybí ti 🪙 ${f.price - state.coins}</button>`);
      const b = $('#order'); if (b) b.onclick = () => { state.coins -= f.price; st.food = f; st.eating = 3; save(); SFX.buy(); refresh(); };
    }
  };
  function doneEating() {
    const f = st.food;
    if (f.id !== 'fruit') { state.buff = f.id; save(); toast(`${f.emo} Výborné! Na příští výpravu: ${f.desc.toLowerCase()}`, 3200); }
    else toast('🍓 Mňam, to bylo sladké!');
    st.food = null; st.sel = null; refresh(); updateHud();
  }
  refresh();
}

/* ---- les: výběr úrovně, výsledek, pauza ---- */
function openForestMenu() {
  const items = LEVELS.map((lv, i) => {
    const g = state.gems[i] || [false, false, false], locked = i + 1 > state.unlocked;
    return `<button class="lvl ${state.done[i] ? 'done' : ''}" data-l="${i}" ${locked ? 'disabled' : ''}>
      <b>${locked ? '🔒' : (state.done[i] ? '✅' : '🌲')} ${i + 1}. ${lv.name}</b>
      <small>${locked ? 'Nejdřív dokonči předchozí' : (state.done[i] ? 'Hotovo – můžeš znovu' : 'Ještě neprozkoumáno')}</small>
      <div class="gems">${g.map(x => x ? '💎' : '◇').join('')}</div></button>`;
  }).join('');
  const buff = state.buff ? `<p>V bříšku máš ${FOOD[state.buff].emo} – <b>${FOOD[state.buff].desc.toLowerCase()}</b>.</p>` : `<p>Tip: v restauraci se můžeš posilnit před cestou. 🍕</p>`;
  showPanel(`<div class="box">
    <header><h2>🌲 Kouzelný les</h2><span class="pill">💎 ${totalGems()} / ${LEVELS.length * 3}</span><button class="x" data-close aria-label="Zavřít">✕</button></header>
    <div class="col"><p>Kam se vydáš? Sbírej mince 🪙 a v každém lese najdi 3 drahokamy 💎 – v butiku za ně dostaneš kouzelné věci.</p>${buff}
    <div class="levels">${items}</div>
    <p style="font-size:14px;color:var(--muted)">Ovládání: šipky ← → a mezerník (nebo tlačítka na obrazovce). Na ježky, včely a žáby můžeš skočit shora!</p></div></div>`, {});
  panel.querySelectorAll('.lvl').forEach(b => b.onclick = () => { SFX.click(); startLevel(+b.dataset.l); });
}
function finishLevel() {
  const i = L.idx, first = !state.done[i], before = totalGems();
  const bonus = first ? 10 : 3;
  state.coins += bonus; state.done[i] = true;
  state.unlocked = Math.max(state.unlocked, Math.min(LEVELS.length, i + 2));
  const g = state.gems[i] || [false, false, false];
  run.gems.forEach((x, k) => { if (x) g[k] = true; });
  state.gems[i] = g;
  save();
  const after = totalGems(), newItems = ITEMS.filter(it => it.gems && it.gems > before && it.gems <= after);
  openResult(true, bonus, newItems);
}
function openResult(win, bonus = 0, newItems = []) {
  const i = L.idx, next = i + 1 < LEVELS.length;
  const gems = run.gems.map(x => x ? '💎' : '◇').join(' ');
  const unlock = newItems.length ? `<p>🎁 V butiku tě čeká odměna: <b>${newItems.map(n => n.name).join(', ')}</b>!</p>` : '';
  showPanel(`<div class="box small"><header><h2>${win ? '🎉 Hurá, cíl!' : '😵 Ajaj!'}</h2></header>
    <div class="col">
      <div class="big-emo">${win ? '🏁' : '💔'}</div>
      <p style="text-align:center">${win ? `${state.name ? esc(state.name) + ', z' : 'Z'}vládla jsi les <b>${LEVELS[i].name}</b>!` : 'Došla ti srdíčka. Nevadí, zkus to znovu!'}</p>
      <p style="text-align:center;font-size:22px;font-weight:800">🪙 ${run.coins}${bonus ? ` + ${bonus} odměna` : ''} &nbsp; ${gems}</p>
      ${unlock}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        ${win && next ? `<button class="btn" id="rNext">Další les ➜</button>` : ''}
        ${!win ? `<button class="btn" id="rAgain">Zkusit znovu</button>` : ''}
        <button class="btn ghost" id="rTown">Do městečka</button>
      </div></div></div>`, {dismissable: false});
  const keepBuff = run.buff;
  if ($('#rNext')) $('#rNext').onclick = () => { SFX.click(); startLevel(i + 1); };
  if ($('#rAgain')) $('#rAgain').onclick = () => { SFX.click(); if (keepBuff && !state.buff) state.buff = keepBuff; startLevel(i); };
  $('#rTown').onclick = () => { SFX.click(); goTown(); };
}
function goTown() {
  closePanel(); scene = 'town'; L = null; document.body.classList.remove('play');
  town.x = 2250; town.facing = -1; state.townX = town.x; save();
}
function openMenu() {
  audio();
  const inForest = scene === 'forest';
  showPanel(`<div class="box small"><header><h2>${inForest ? '⏸ Pauza' : '☰ Nabídka'}</h2><button class="x" data-close aria-label="Zavřít">✕</button></header>
    <div class="col">
      ${inForest ? `<button class="btn" data-close>Pokračovat</button><button class="btn ghost" id="mRestart">Začít tenhle les znovu</button><button class="btn ghost" id="mTown">Odejít do městečka</button>` : ''}
      <button class="btn ghost" id="mSound">${state.sound ? '🔊 Zvuk je zapnutý' : '🔇 Zvuk je vypnutý'}</button>
      <p style="font-size:15px;color:var(--muted)">Hra se ukládá sama. Když ji zavřeš a znovu otevřeš, budeš mít stejné oblečení i mince.</p>
      ${!inForest ? `<button class="btn ghost" id="mReset" style="font-size:16px">Smazat hru a začít úplně znovu</button>` : ''}
    </div></div>`, {});
  $('#mSound').onclick = () => { state.sound = !state.sound; save(); openMenu(); SFX.click(); };
  if ($('#mRestart')) $('#mRestart').onclick = () => { const b = run.buff; if (b && !state.buff) state.buff = b; startLevel(L.idx); };
  if ($('#mTown')) $('#mTown').onclick = () => goTown();
  if ($('#mReset')) $('#mReset').onclick = () => {
    const b = $('#mReset');
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Opravdu? Klepni ještě jednou.'; b.style.background = '#ffe1e1'; return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = freshState(); town.x = state.townX; closePanel(); openIntro();
  };
}
$('#bMenu').onclick = () => { SFX.click(); if (ui) closePanel(true); else openMenu(); };

/* ---- úvod ---- */
function openIntro() {
  const o = state.outfit;
  showPanel(`<div class="box">
    <header><h2>👋 Vítej v Módním městečku!</h2></header>
    <div class="pbody"><div class="stage"><canvas id="pv"></canvas></div>
    <div class="side"><div class="col">
      <p>Jak se jmenuješ?</p><input type="text" id="nm" maxlength="14" placeholder="Tvoje jméno" value="${esc(state.name)}">
      <p>Vyber si účes:</p><div class="tabs" id="hs" style="flex-wrap:wrap;padding:0"></div>
      <p>Barva vlasů:</p><div class="swatches" id="hc" style="padding:0"></div>
      <p>Barva pleti:</p><div class="swatches" id="sk" style="padding:0"></div>
    </div><div class="actions"><div class="info">Oblečení si pak vybereš doma v šatníku a v butiku.</div><button class="btn" id="go">Jdeme do městečka! ➜</button></div></div></div></div>`, {
    dismissable: false,
    preview: (t) => previewLoop($('#pv'), (c, W, H) => drawStage(c, W, H, state.outfit, t, {wave: true})),
    onEnter: () => $('#go').click()
  });
  const draw = () => {
    const hs = $('#hs'); hs.innerHTML = '';
    HAIR_STYLES.forEach(h => { const b = document.createElement('button'); b.className = 'tab' + (o.hairStyle === h.id ? ' on' : ''); b.textContent = h.name; b.onclick = () => { SFX.click(); o.hairStyle = h.id; draw(); }; hs.appendChild(b); });
    $('#hc').innerHTML = ''; swatches($('#hc'), HAIR_COLORS, o.hairColor, v => { o.hairColor = v; draw(); });
    $('#sk').innerHTML = ''; swatches($('#sk'), SKINS, o.skin, v => { o.skin = v; draw(); });
  };
  draw();
  $('#go').onclick = () => {
    const n = $('#nm').value.trim();
    if (!n) { $('#nm').focus(); $('#nm').placeholder = 'Napiš sem své jméno 🙂'; return; }
    state.name = n; state.started = true; save(); SFX.buy(); closePanel();
    toast(`Ahoj, ${n}! Zajdi domů do šatníku 🏠 nebo do butiku ✨`, 3500);
  };
}

/* ---------------- HUD a hlavní smyčka ---------------- */
let scene = 'town', hudKey = '';
function updateHud() {
  let hearts = '', buff = '';
  if (scene === 'forest' && run) {
    hearts = '❤️'.repeat(Math.max(0, run.hearts)) + '🤍'.repeat(Math.max(0, run.maxHearts - run.hearts));
    buff = run.buff ? FOOD[run.buff].emo : '';
  } else buff = state.buff ? FOOD[state.buff].emo : '';
  const coins = `🪙 ${state.coins}`;
  const gems = scene === 'forest' && run ? run.gems.map(x => x ? '💎' : '◇').join('') : `💎 ${totalGems()}`;
  const key = coins + gems + hearts + buff;
  if (key === hudKey) return; hudKey = key;
  $('#hCoins').textContent = coins; $('#hGems').textContent = gems; $('#hHearts').textContent = hearts; $('#hBuff').textContent = buff;
}

let last = performance.now(), acc = 0, gt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gt += dt;
  if (!ui) {
    acc += dt;
    while (acc >= STEP) { acc -= STEP; if (scene === 'town') updateTown(STEP); else if (L) updateForest(STEP); if (scene === 'forest') updateParts(STEP); }
  } else { acc = 0; if (ui.tick) ui.tick(dt); if (scene === 'forest' && L && run && run.over) updateParts(dt); }
  if (scene === 'town') drawTown(gt); else if (L) drawForest(gt);
  if (ui && ui.preview && $('#pv')) ui.preview(gt);
  if (ui || scene !== 'town') $('#tA').classList.remove('show');
  updateHud();
  requestAnimationFrame(frame);
}

load();
town.x = state.townX;
resize();
if (!state.started) openIntro();
else toast(`Vítej zpátky, ${state.name}! 👋`);
requestAnimationFrame(frame);
</script>
</body>
